<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启动控制台 · 微信聊天小助手</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body class="run-page">

<!-- ================= 顶栏 ================= -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">💬</div>
    <div class="brand">
      <h1>启动控制台</h1>
      <p>只管启停 · 看运行状态</p>
    </div>
    <div class="topbar-right">
      <span class="bot-pill off" id="botStatePill">⚪ 未启动</span>
      <a class="theme-btn nav-btn" href="/" title="回到人设 / 大脑 / 聊天配置">← 返回控制台</a>
      <button class="theme-btn" id="themeToggle" title="切换浅色 / 深色">🌙 深色</button>
    </div>
  </div>
</div>

<div class="container run-container">

  <!-- ================= 大状态 + 启停按钮 ================= -->
  <section class="run-hero">
    <div class="run-hero-left">
      <div class="run-hero-label">机器人运行状态</div>
      <div class="run-hero-status">
        <span class="dot" id="runDot"></span>
        <b id="runStateText">未启动</b>
      </div>
      <p class="run-hero-sub" id="runSub">微信还没连上：点右边「启动机器人」开始</p>
      <div class="run-facts">
        <div class="run-fact"><b id="factUptime">-</b><span>已运行</span></div>
        <div class="run-fact"><b id="factMsg">0</b><span>收到消息</span></div>
        <div class="run-fact"><b id="factReply">0</b><span>自动回复</span></div>
        <div class="run-fact"><b id="factMem">0</b><span>存档轮数</span></div>
        <div class="run-fact"><b id="factQueue">0</b><span>排队中</span></div>
      </div>
    </div>
    <div class="run-hero-right">
      <button class="btn-run start" id="btnStart" onclick="startBot()">
        <span>🚀</span>
        <b>启动机器人</b>
        <small>自动连微信、自动回复</small>
      </button>
      <button class="btn-run stop" id="btnStop" onclick="stopBot()">
        <span>⏹</span>
        <b>停止</b>
        <small>立刻停止自动回复</small>
      </button>
      <button class="btn-easy full" id="btnEasy" onclick="easyMode()">🤖 傻瓜模式：检查好配置后一键全自动启动</button>
      <div class="run-tip" id="runTip">启动后它会自己连微信、监听、回复；关掉程序窗口也会停止。</div>
    </div>
  </section>

  <!-- ================= 配置摘要 + 运行开关 ================= -->
  <div class="run-grid">
    <section class="panel run-card">
      <h2 class="run-card-title">现在用的这套配置</h2>
      <a class="rc-item" href="/">
        <span class="rc-ico">🎭</span>
        <span class="rc-body"><b id="curPersona">读取中…</b><small>人设 · 点这里去改</small></span>
        <span class="rc-arrow">→</span>
      </a>
      <a class="rc-item" href="/">
        <span class="rc-ico">🧠</span>
        <span class="rc-body"><b id="curBrain">读取中…</b><small>AI 大脑 · 点这里去换</small></span>
        <span class="rc-arrow">→</span>
      </a>
      <a class="rc-item" href="/">
        <span class="rc-ico">👥</span>
        <span class="rc-body"><b id="curListen">读取中…</b><small>监听好友 · 点这里去加</small></span>
        <span class="rc-arrow">→</span>
      </a>
    </section>

    <section class="panel run-card">
      <h2 class="run-card-title">运行开关 <small>改完立刻生效</small></h2>
      <div class="switch-list compact">
        <label class="switch-card" id="swAutoStart"><input type="checkbox" id="rtAutoStart" onchange="saveRuntime()"><span class="sw-txt"><b>开机自动启动</b><small>程序一运行就自己连微信开始工作</small></span></label>
        <label class="switch-card" id="swAutoReply"><input type="checkbox" id="rtAutoReply" onchange="saveRuntime()"><span class="sw-txt"><b>收到消息自动回复</b><small>有人发微信来，它自己想回复并发送</small></span></label>
        <label class="switch-card" id="swAutoMemory"><input type="checkbox" id="rtAutoMemory" onchange="saveRuntime()"><span class="sw-txt"><b>聊天记录自动存档</b><small>每句话都记下来，越聊越懂对方</small></span></label>
        <label class="switch-card" id="swAutoReconnect"><input type="checkbox" id="rtAutoReconnect" onchange="saveRuntime()"><span class="sw-txt"><b>微信掉线自动重连</b><small>网络闪断自己恢复，不用人守着</small></span></label>
      </div>
      <div class="action-row">
        <span class="muted-sm">连不上微信时最多重试</span>
        <input type="number" id="rtRetry" min="1" max="20" value="3" class="num-input">
        <span class="muted-sm">次</span>
        <button class="btn-ghost" onclick="saveRuntime(true)">💾 保存</button>
        <span id="runtimeStatus" class="muted-sm"></span>
      </div>
    </section>
  </div>

  <!-- ================= 最近活动 ================= -->
  <section class="panel run-card">
    <h2 class="run-card-title">最近活动</h2>
    <div class="log-box" id="runLog">暂无操作记录。</div>
  </section>

  <div class="footer-note">微信聊天小助手 · 启动 / 停止都在这个页面 · 关掉程序窗口即停止自动回复</div>
</div>

<div id="toast" class="toast">已保存！</div>
<button class="back-top" id="backTop" title="返回顶部">↑</button>

<script src="/static/js/run.js"></script>
<script src="/static/js/theme.js"></script>
</body>
</html>
